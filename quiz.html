<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Part 107 Quizzer</title>
  <style>
    :root {
      font-family: Arial, Helvetica, sans-serif;
      color: #111827;
      line-height: 1.45;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #f3f4f6;
    }

    .quiz-card {
      max-width: 920px;
      margin: 0 auto;
      padding: 20px;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin: 0 0 14px;
      font-size: 1.55rem;
    }

    #progress {
      margin-bottom: 4px;
      color: #4b5563;
      font-size: 0.95rem;
    }

    #scoreTracker {
      margin-bottom: 10px;
      color: #1f2937;
      font-size: 0.95rem;
      font-weight: 600;
    }

    #questionText {
      margin-bottom: 12px;
      font-weight: 600;
      font-size: 1.05rem;
    }

    .answers label {
      display: block;
      margin: 8px 0;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      cursor: pointer;
      background: #fafafa;
    }

    .answers input[type='radio'] {
      margin-right: 8px;
    }

    #questionFigure {
      margin-top: 14px;
      max-width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      display: none;
    }

    .controls {
      margin-top: 16px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 1rem;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button.secondary {
      background: #6b7280;
    }

    button.secondary:hover {
      background: #4b5563;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    #message {
      margin-top: 10px;
      min-height: 1.1em;
      font-weight: 600;
    }

    .correct-message { color: #047857; }
    .incorrect-message { color: #b91c1c; }

    #explanation {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      background: #eff6ff;
      color: #1e3a8a;
      min-height: 1.2em;
    }

    .result-row {
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid;
    }

    .result-row.correct {
      background: #ecfdf5;
      border-color: #86efac;
    }

    .result-row.incorrect {
      background: #fef2f2;
      border-color: #fca5a5;
    }
  </style>
</head>
<body>
  <main class="quiz-card" id="app">
    <h1>Part 107 Practice Quiz</h1>
    <section id="quizSection">
      <div id="progress"></div>
      <div id="scoreTracker"></div>
      <div id="questionText"></div>

      <form id="answerForm" class="answers">
        <label><input type="radio" name="answer" value="A" /> <strong>A:</strong> <span id="answerA"></span></label>
        <label><input type="radio" name="answer" value="B" /> <strong>B:</strong> <span id="answerB"></span></label>
        <label><input type="radio" name="answer" value="C" /> <strong>C:</strong> <span id="answerC"></span></label>
      </form>

      <img id="questionFigure" alt="Sectional chart for this question" />

      <div class="controls">
        <button type="button" id="checkButton">Check Answer</button>
        <button type="button" id="explainButton" class="secondary">Explain</button>
        <button type="button" id="nextButton">Next Question</button>
      </div>
      <div id="message"></div>
      <div id="explanation"></div>
    </section>
  </main>

  <script>
    const QUESTIONS_CSV_URL = './updated_questions_with_figures.csv';
    const EXPLANATIONS_CSV_URL = './explanations.csv';

    const state = {
      questions: [],
      explanations: new Map(),
      currentIndex: 0,
      responses: [],
      checkedAnswers: []
    };

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let value = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i += 1) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (inQuotes && nextChar === '"') {
            value += '"';
            i += 1;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          row.push(value);
          value = '';
        } else if ((char === '
' || char === '') && !inQuotes) {
          if (char === '' && nextChar === '
') {
            i += 1;
          }
          row.push(value);
          value = '';
          if (row.some((cell) => cell !== '')) {
            rows.push(row);
          }
          row = [];
        } else {
          value += char;
        }
      }

      if (value.length || row.length) {
        row.push(value);
        if (row.some((cell) => cell !== '')) {
          rows.push(row);
        }
      }

      return rows;
    }

    function mapRowsToObjects(rows) {
      if (!rows.length) return [];
      const headers = rows[0].map((header) => header.trim());
      return rows.slice(1).map((row) => {
        const mapped = {};
        headers.forEach((header, index) => {
          mapped[header] = (row[index] || '').trim();
        });
        return mapped;
      });
    }

    function mapRowsToQuestions(rows) {
      return mapRowsToObjects(rows).filter((question) => {
        const correctAnswer = (question['Correct Answer'] || '').trim().toUpperCase();
        return Boolean(
          question.Question &&
          question['Option A'] &&
          question['Option B'] &&
          question['Option C'] &&
          ['A', 'B', 'C'].includes(correctAnswer)
        );
      });
    }

    function mapRowsToExplanations(rows) {
      const explanationMap = new Map();
      mapRowsToObjects(rows).forEach((item) => {
        if (item.Question) {
          explanationMap.set(item.Question, item.Explanation || 'No explanation available for this question.');
        }
      });
      return explanationMap;
    }

    function getSelectedAnswer() {
      const selected = document.querySelector('input[name="answer"]:checked');
      return selected ? selected.value : '';
    }

    function getAnswerCounts() {
      return state.questions.reduce((counts, question, index) => {
        const userAnswer = (state.responses[index] || '').toUpperCase();
        const correctAnswer = (question['Correct Answer'] || '').toUpperCase();

        if (!userAnswer) return counts;
        if (userAnswer === correctAnswer) counts.correct += 1;
        else counts.wrong += 1;

        return counts;
      }, { correct: 0, wrong: 0 });
    }

    function getOptionText(question, optionLetter) {
      return question[`Option ${optionLetter}`] || '';
    }

    function renderQuestion() {
      const question = state.questions[state.currentIndex];
      const total = state.questions.length;

      document.getElementById('progress').textContent = `Question ${state.currentIndex + 1} of ${total}`;
      document.getElementById('questionText').textContent = question.Question || '';
      document.getElementById('answerA').textContent = getOptionText(question, 'A');
      document.getElementById('answerB').textContent = getOptionText(question, 'B');
      document.getElementById('answerC').textContent = getOptionText(question, 'C');
      document.getElementById('message').textContent = '';
      document.getElementById('message').className = '';
      document.getElementById('explanation').innerHTML = '';

      const counts = getAnswerCounts();
      document.getElementById('scoreTracker').textContent = `Right: ${counts.correct} | Wrong: ${counts.wrong}`;

      const saved = state.responses[state.currentIndex] || '';
      document.querySelectorAll('input[name="answer"]').forEach((input) => {
        input.checked = input.value === saved;
      });

      const figureFile = (question.FigureFile || '').trim();
      const figure = document.getElementById('questionFigure');
      if (figureFile) {
        figure.src = `./${figureFile}`;
        figure.style.display = 'block';
      } else {
        figure.removeAttribute('src');
        figure.style.display = 'none';
      }

      document.getElementById('nextButton').textContent = state.currentIndex === total - 1 ? 'Finish' : 'Next Question';
    }

    function showMessage(text, isCorrect) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = isCorrect ? 'correct-message' : 'incorrect-message';
    }

    function handleCheckAnswer() {
      const selected = getSelectedAnswer();
      const question = state.questions[state.currentIndex];
      const correct = (question['Correct Answer'] || '').toUpperCase();

      state.responses[state.currentIndex] = selected;
      state.checkedAnswers[state.currentIndex] = true;

      if (!selected) {
        showMessage('Please select an answer before checking.', false);
        return;
      }

      showMessage(selected === correct ? 'Correct' : 'Incorrect', selected === correct);
    }

    function handleExplain() {
      const question = state.questions[state.currentIndex];
      const explanationBase = state.explanations.get(question.Question) || 'No explanation available for this question.';
      const selected = (state.responses[state.currentIndex] || getSelectedAnswer() || '').toUpperCase();
      const correct = (question['Correct Answer'] || '').toUpperCase();
      const explanationEl = document.getElementById('explanation');

      let explanationText = explanationBase;
      if (selected && selected !== correct) {
        explanationText += ` Your selected answer (${selected}: ${getOptionText(question, selected)}) is incorrect because the correct answer is ${correct}: ${getOptionText(question, correct)}.`;
      } else if (selected && selected === correct) {
        explanationText += ` You selected ${selected}, which is correct.`;
      }

      explanationEl.textContent = explanationText;
    }

    function renderResults() {
      let score = 0;
      const results = state.questions.map((question, index) => {
        const userAnswer = state.responses[index] || '(no answer)';
        const correctAnswer = (question['Correct Answer'] || '').toUpperCase();
        const isCorrect = userAnswer.toUpperCase() === correctAnswer;
        if (isCorrect) score += 1;

        return {
          index,
          questionText: question.Question,
          userAnswer,
          correctAnswer,
          isCorrect
        };
      });

      const wrong = state.questions.length - score;
      const quizSection = document.getElementById('quizSection');
      quizSection.innerHTML = `
        <h2>Your Score: ${score} / ${state.questions.length}</h2>
        <p><strong>Right:</strong> ${score} &nbsp; <strong>Wrong:</strong> ${wrong}</p>
        <p>Summary of answers:</p>
        <div id="resultsContainer"></div>
      `;

      const resultsContainer = document.getElementById('resultsContainer');
      results.forEach((result) => {
        const row = document.createElement('div');
        row.className = `result-row ${result.isCorrect ? 'correct' : 'incorrect'}`;
        row.innerHTML = `
          <strong>Q${result.index + 1}.</strong> ${result.questionText}<br>
          Your answer: <strong>${result.userAnswer}</strong><br>
          Correct answer: <strong>${result.correctAnswer}</strong>
        `;
        resultsContainer.appendChild(row);
      });
    }

    function handleNext() {
      if (!state.responses[state.currentIndex]) {
        state.responses[state.currentIndex] = getSelectedAnswer();
      }

      if (state.currentIndex < state.questions.length - 1) {
        state.currentIndex += 1;
        renderQuestion();
      } else {
        renderResults();
      }
    }

    async function loadData() {
      const [questionResponse, explanationResponse] = await Promise.all([
        fetch(QUESTIONS_CSV_URL),
        fetch(EXPLANATIONS_CSV_URL)
      ]);

      if (!questionResponse.ok || !explanationResponse.ok) {
        throw new Error('Unable to fetch one or more quiz data files.');
      }

      const [questionCsv, explanationCsv] = await Promise.all([
        questionResponse.text(),
        explanationResponse.text()
      ]);

      state.questions = mapRowsToQuestions(parseCsv(questionCsv));
      state.explanations = mapRowsToExplanations(parseCsv(explanationCsv));
    }

    async function init() {
      try {
        await loadData();
      } catch (error) {
        document.getElementById('quizSection').innerHTML = `<p style="color:#b91c1c;"><strong>Error:</strong> ${error.message}</p>`;
        return;
      }

      if (!state.questions.length) {
        document.getElementById('quizSection').innerHTML = `
          <p style="color:#b91c1c;"><strong>Error:</strong> No questions were found in updated_questions_with_figures.csv.</p>
        `;
        return;
      }

      document.getElementById('checkButton').addEventListener('click', handleCheckAnswer);
      document.getElementById('explainButton').addEventListener('click', handleExplain);
      document.getElementById('nextButton').addEventListener('click', handleNext);
      renderQuestion();
    }

    init();
  </script>

</body>
</html>
