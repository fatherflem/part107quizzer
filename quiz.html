<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Part 107 Quizzer</title>
  <style>
    :root {
      font-family: Arial, Helvetica, sans-serif;
      color: #111827;
      line-height: 1.45;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #f3f4f6;
    }

    .quiz-card {
      max-width: 920px;
      margin: 0 auto;
      padding: 20px;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin: 0 0 14px;
      font-size: 1.55rem;
    }

    #progress {
      margin-bottom: 10px;
      color: #4b5563;
      font-size: 0.95rem;
    }

    #questionText {
      margin-bottom: 12px;
      font-weight: 600;
      font-size: 1.05rem;
    }

    .answers label {
      display: block;
      margin: 8px 0;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      cursor: pointer;
      background: #fafafa;
    }

    .answers input[type='radio'] {
      margin-right: 8px;
    }

    #questionFigure {
      margin-top: 14px;
      max-width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      display: none;
    }

    .controls {
      margin-top: 16px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 1rem;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #message {
      margin-top: 10px;
      min-height: 1.1em;
      color: #b91c1c;
    }

    .result-row {
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid;
    }

    .result-row.correct {
      background: #ecfdf5;
      border-color: #86efac;
    }

    .result-row.incorrect {
      background: #fef2f2;
      border-color: #fca5a5;
    }
  </style>
</head>
<body>
  <main class="quiz-card" id="app">
    <h1>Part 107 Practice Quiz</h1>
    <section id="quizSection">
      <div id="progress"></div>
      <div id="questionText"></div>

      <form id="answerForm" class="answers">
        <label><input type="radio" name="answer" value="A" /> <strong>A:</strong> <span id="answerA"></span></label>
        <label><input type="radio" name="answer" value="B" /> <strong>B:</strong> <span id="answerB"></span></label>
        <label><input type="radio" name="answer" value="C" /> <strong>C:</strong> <span id="answerC"></span></label>
      </form>

      <img id="questionFigure" alt="Sectional chart for this question" />

      <div class="controls">
        <button type="button" id="nextButton">Next</button>
      </div>
      <div id="message"></div>
    </section>
  </main>

  <script>
    const state = {
      questions: [],
      currentIndex: 0,
      responses: []
    };

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let value = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i += 1) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (inQuotes && nextChar === '"') {
            value += '"';
            i += 1;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          row.push(value);
          value = '';
        } else if ((char === '\n' || char === '\r') && !inQuotes) {
          if (char === '\r' && nextChar === '\n') {
            i += 1;
          }
          row.push(value);
          value = '';
          if (row.some((cell) => cell !== '')) {
            rows.push(row);
          }
          row = [];
        } else {
          value += char;
        }
      }

      if (value.length || row.length) {
        row.push(value);
        if (row.some((cell) => cell !== '')) {
          rows.push(row);
        }
      }

      return rows;
    }

    function mapRowsToQuestions(rows) {
      if (!rows.length) {
        return [];
      }

      const headers = rows[0].map((header) => header.trim());
      return rows.slice(1).map((row) => {
        const question = {};
        headers.forEach((header, index) => {
          question[header] = (row[index] || '').trim();
        });
        return question;
      }).filter((question) => question.Question);
    }

    function getSelectedAnswer() {
      const selected = document.querySelector('input[name="answer"]:checked');
      return selected ? selected.value : '';
    }

    function renderQuestion() {
      const question = state.questions[state.currentIndex];
      const total = state.questions.length;

      document.getElementById('progress').textContent = `Question ${state.currentIndex + 1} of ${total}`;
      document.getElementById('questionText').textContent = question.Question || '';
      document.getElementById('answerA').textContent = question['Option A'] || '';
      document.getElementById('answerB').textContent = question['Option B'] || '';
      document.getElementById('answerC').textContent = question['Option C'] || '';
      document.getElementById('message').textContent = '';

      const saved = state.responses[state.currentIndex] || '';
      document.querySelectorAll('input[name="answer"]').forEach((input) => {
        input.checked = input.value === saved;
      });

      const figureFile = (question.FigureFile || '').trim();
      const figure = document.getElementById('questionFigure');
      if (figureFile) {
        figure.src = `./${figureFile}`;
        figure.style.display = 'block';
      } else {
        figure.removeAttribute('src');
        figure.style.display = 'none';
      }

      document.getElementById('nextButton').textContent = state.currentIndex === total - 1 ? 'Finish' : 'Next';
    }

    function renderResults() {
      let score = 0;

      const results = state.questions.map((question, index) => {
        const userAnswer = state.responses[index] || '(no answer)';
        const correctAnswer = (question['Correct Answer'] || '').toUpperCase();
        const isCorrect = userAnswer.toUpperCase() === correctAnswer;

        if (isCorrect) {
          score += 1;
        }

        return {
          index,
          questionText: question.Question,
          userAnswer,
          correctAnswer,
          isCorrect
        };
      });

      const quizSection = document.getElementById('quizSection');
      quizSection.innerHTML = `
        <h2>Your Score: ${score} / ${state.questions.length}</h2>
        <p>Summary of answers:</p>
        <div id="resultsContainer"></div>
      `;

      const resultsContainer = document.getElementById('resultsContainer');
      results.forEach((result) => {
        const row = document.createElement('div');
        row.className = `result-row ${result.isCorrect ? 'correct' : 'incorrect'}`;
        row.innerHTML = `
          <strong>Q${result.index + 1}.</strong> ${result.questionText}<br>
          Your answer: <strong>${result.userAnswer}</strong><br>
          Correct answer: <strong>${result.correctAnswer}</strong>
        `;
        resultsContainer.appendChild(row);
      });
    }

    function handleNext() {
      state.responses[state.currentIndex] = getSelectedAnswer();

      if (state.currentIndex < state.questions.length - 1) {
        state.currentIndex += 1;
        renderQuestion();
      } else {
        renderResults();
      }
    }

    async function init() {
      try {
        const response = await fetch('./updated_questions_with_figures.csv');
        if (!response.ok) {
          throw new Error(`Unable to load CSV (${response.status})`);
        }

        const csvText = await response.text();
        state.questions = mapRowsToQuestions(parseCsv(csvText));

        if (!state.questions.length) {
          throw new Error('No questions were found in the CSV.');
        }

        document.getElementById('nextButton').addEventListener('click', handleNext);
        renderQuestion();
      } catch (error) {
        document.getElementById('quizSection').innerHTML = `
          <p style="color:#b91c1c;"><strong>Error:</strong> ${error.message}</p>
          <p>If you opened this page with <code>file://</code>, use a local web server so <code>fetch()</code> can read files.</p>
        `;
      }
    }

    init();
  </script>
</body>
</html>
