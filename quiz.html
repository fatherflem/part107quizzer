const EXPLANATIONS = {"What are characteristics of a moist unstable air mass?": "A moist, unstable air mass contains rising air that cools and condenses quickly, forming cumuliform clouds. This vertical movement leads to turbulence and showery precipitation. Poor visibility and smooth air are associated with stable conditions, and haze and smoke describe reduced visibility due to aerosols rather than convective weather.", "According to 14 CFR part 107 how may a remote pilot operate an unmanned aircraft in Class C airspace?": "Part 107 requires remote pilots to obtain prior authorization from Air Traffic Control (ATC) before operating in Class C airspace. Monitoring ATC frequencies or contacting ATC after launch does not satisfy this requirement and can jeopardize safety.", "According to 14 CFR part 107 the remote pilot in command (PIC) of a small unmanned aircraft planning to operate within Class C airspace": "Class C airspace is controlled; the remote PIC must receive ATC authorization before flight. Filing a flight plan or using a visual observer may be advisable but are not required by regulation for this operation.", "What effect does high density altitude have on the efficiency of a UA propeller?": "High density altitude means thinner air, which reduces propeller thrust and aerodynamic efficiency. Propellers are less effective in thin air, so efficiency decreases. Efficiency never increases with density altitude and is not immune to its effects.", "At Coeur D’Alene which frequency should be used as a Common Traffic Advisory Frequency (CTAF) to monitor airport traffic?": "For Coeur D’Alene, the Common Traffic Advisory Frequency (CTAF) is 122.8 MHz. This frequency allows pilots to self-announce position and intentions. The other frequencies listed are used for other purposes and would not alert local traffic.", "Which technique should a remote pilot use to scan for traffic? A remote pilot should": "Pilots should divide the sky into small sectors and systematically scan each for a second or so. This method helps detect traffic without fixating. Simply sweeping continuously or relying on peripheral vision can allow hazards to be overlooked.", "If an unmanned airplane weighs 33 pounds what approximate weight would the airplane structure be required to support during a 30° banked turn while maintaining altitude?": "A 30° banked turn increases the load factor to about 1.2 G. A 33‑lb aircraft must then support roughly 40 lb; the closest option is 38 lb. Lower values underestimate the structural load and higher values overstate it.", "What is the floor of the Savannah Class C airspace at the shelf area (outer circle)?": "On the Savannah sectional chart, the outer shelf of Class C airspace begins at 1 300 feet MSL. ‘AGL’ refers to height above the ground and would vary with terrain; 1 700 ft MSL is the top of the outer shelf, not the floor.", "With ATC authorization you are operating your small unmanned aircraft approximately 4 SM southeast of Elizabeth City Regional Airport (ECG). What hazard is indicated to be in that area?": "The sectional chart shows a caution symbol southeast of Elizabeth City indicating an unmarked balloon on a cable extending up to 3 008 ft AGL. This is a collision hazard. There is no heavy military activity in that area.", "You have been hired by a farmer to use your small UA to inspect his crops. The area that you are to survey is in the Devil’s Lake West MOA east of area 2. How would you find out if the MOA is active?": "Military Operations Areas (MOAs) have published hours. The sectional chart legend or the chart supplement lists when an MOA is active. There is no ‘Small UAS database,’ and the Military Operations Directory does not provide real‑time status.", "The most comprehensive information on a given airport is provided by": "The Chart Supplement U.S. (formerly Airport/Facility Directory) contains detailed information about airports—runways, communications, services and hazards. NOTAMs provide temporary changes, and terminal area charts depict airspace but lack full details.", "Identify the hazardous attitude or characteristic a remote pilot displays while taking risks in order to impress others.": "Taking risks to impress others reflects the macho hazardous attitude—feeling a need to prove oneself. Impulsivity is acting without thinking, and invulnerability is the belief that accidents won’t happen to you.", "You have been hired to inspect the tower under construction at 46.9°N and 98.6°W near Jamestown Regional (JMS). What must you receive prior to flying your unmanned aircraft in this area?": "The correct answer is Authorization from ATC. This answer is correct based on FAA regulations or aeronautical principles applicable to the situation described in the question. The other options Authorization from the military and Authorization from the National Park Service are incorrect because they do not align with the requirements or facts described in the corresponding regulation or concept.", "How would a remote PIC “CHECK NOTAMS” as noted in the CAUTION box regarding the unmarked balloon?": "The correct answer is not provided in the dataset. Please refer to official FAA resources or training materials for guidance. The other options By utilizing the B4UFLY mobile application and By contacting the FAA district office are incorrect because they do not align with the requirements or facts described in the corresponding regulation or concept.", "When adapting crew resource management (CRM) concepts to the operation of a small UA": "The correct answer is the communications only. This answer is correct based on FAA regulations or aeronautical principles applicable to the situation described in the question. The other options  CRM must be integrated into and the flight portion only are incorrect because they do not align with the requirements or facts described in the corresponding regulation or concept.", "You have been hired as a remote pilot by a local TV news stat function normalizeForComparison(value){return (value||'').replace(/_/g,'').replace(/[^a-zA-Z0-9]+/g,' ').trim().replace(/\s+/g,' ').toLowerCase();}
const fallbackFigureFiles = {"at coeur d alene which frequency should be used as a common traffic advisory frequency ctaf to monitor airport traffic": "figure22-055.png"};
function shuffleArray(array){const copy=[...array];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]];}return copy;}
const originalQuestions = QUESTIONS.map(q=>({...q}));
const state={questions:[],currentIndex:0,responses:[],checkedAnswers:[]};
function validateQuestions(questions){const errors=[];questions.forEach((q,index)=>{const n=index+1;if(!q.Question||!q.Question.trim())errors.push(`Q${n}: missing Question`);if(!q['Option A']||!q['Option A'].trim())errors.push(`Q${n}: missing Option A`);if(!q['Option B']||!q['Option B'].trim())errors.push(`Q${n}: missing Option B`);if(!q['Option C']||!q['Option C'].trim())errors.push(`Q${n}: missing Option C`);if(!['A','B','C'].includes(q['Correct Answer']))errors.push(`Q${n}: invalid Correct Answer`);for(const letter of ['A','B','C']){const option=(q[`Option ${letter}`]||'').trim();if(option.startsWith('__')||option.endsWith('__'))errors.push(`Q${n}: Option ${letter} still has markdown underscores`);if(option==='A'||option==='B'||option==='C')errors.push(`Q${n}: Option ${letter} is suspiciously just ${option}`);}});return errors;}
function startQuiz(shuffle=false){state.questions=shuffle?shuffleArray(originalQuestions):[...originalQuestions];state.currentIndex=0;state.responses=[];state.checkedAnswers=[];renderQuestion();}
function renderStart(){app.innerHTML=`<h1>Part 107 Quizzer</h1><button id=o>Start in Original Order</button> <button id=s>Start Shuffled</button>`;o.onclick=()=>startQuiz(false);s.onclick=()=>startQuiz(true);}
function renderQuestion(){const question=state.questions[state.currentIndex];const normalizedQuestion=normalizeForComparison(question.Question);const figureFile=(question.FigureFile||fallbackFigureFiles[normalizedQuestion]||'').trim();app.innerHTML=`<h3>Question ${state.currentIndex+1}/${state.questions.length}</h3><p>${question.Question}</p><img id='questionFigure' style='max-width:100%;display:none'><div><label><input type=radio name=ans value=A>A: ${question['Option A']}</label><br><label><input type=radio name=ans value=B>B: ${question['Option B']}</label><br><label><input type=radio name=ans value=C>C: ${question['Option C']}</label></div><button id=check>Check Answer</button> <button id=explain>Explain</button> <button id=next>Next Question</button><div id=feedback></div>`;const figure=document.getElementById('questionFigure');if(figureFile){figure.src=`./${figureFile}`;figure.alt=`Sectional chart for ${question.Question}`;figure.style.display='block';}else{figure.removeAttribute('src');figure.style.display='none';}
check.onclick=()=>{const selected=document.querySelector('input[name=ans]:checked')?.value;if(!selected)return;state.responses[state.currentIndex]=selected;feedback.textContent=selected===question['Correct Answer']?'Correct':'Incorrect';};
explain.onclick=()=>{const correct=question['Correct Answer'];const correctText=question[`Option ${correct}`];const exp=EXPLANATIONS[question.Question]||EXPLANATIONS[Object.keys(EXPLANATIONS).find(k=>normalizeForComparison(k)===normalizedQuestion)]||'';feedback.innerHTML=`<p>Correct answer: ${correct} — ${correctText}</p><p>${exp}</p>`;};
next.onclick=()=>{state.currentIndex++;if(state.currentIndex>=state.questions.length){const score=state.responses.reduce((acc,r,i)=>acc+(r===state.questions[i]['Correct Answer']),0);app.innerHTML=`<h2>Final score: ${score}/${state.questions.length}</h2><button id=restart>Restart</button>`;restart.onclick=renderStart;return;}renderQuestion();};}

')+'</pre>';}else{renderStart();}
